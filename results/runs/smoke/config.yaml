run:
  name: smoke
  seed: 0
  out_dir: results/runs
  device: cpu
  threads: 2
  deterministic: true
netgen:
  n_per_tier:
  - 6
  - 5
  - 4
  - 3
  - 4
  n_regions: 2
  same_region_prob: 0.55
  groups_per_node:
  - 1
  - 3
  sole_source_prob: 0.4
  max_suppliers_per_group: 3
  preferential_exponent: 1.0
  lead_time_same_region:
  - 1
  - 2
  lead_time_cross_region:
  - 2
  - 4
  capacity_slack:
  - 0.08
  - 0.45
  base_stock_periods:
  - 0.0
  - 1.2
  input_cover_periods:
  - 0.3
  - 1.8
  bom_coeff:
  - 0.8
  - 1.6
  demand_mean:
  - 8.0
  - 20.0
  demand_cv: 0.2
  large_scale: 2.0
disgen:
  kinds:
  - supplier_outage
  - capacity_reduction
  - lead_time_inflation
  - demand_spike
  - lane_closure
  - regional_event
  n_points:
  - 1
  - 1
  start:
  - 2
  - 8
  duration:
  - 4
  - 18
  severity:
  - 0.4
  - 1.0
  lead_severity:
  - 0.5
  - 3.0
  demand_severity:
  - 0.4
  - 2.0
  upstream_bias: 0.6
  holdout_kind: demand_spike
  multi_points:
  - 2
  - 3
sim:
  warmup: 12
  horizon: 14
  backlog: true
  backlog_cap_periods: 6.0
  allow_resourcing: false
  allocation: proportional
  record_trajectory: true
dataset:
  n_train_networks: 3
  n_shift_networks: 2
  n_large_networks: 1
  scenarios_per_train_network: 30
  scenarios_per_eval_network: 10
  val_fraction: 0.12
  test_id_fraction: 0.12
  traj_periods: 10
  cache_dir: data/scenarios
model:
  hidden: 24
  layers: 2
  dropout: 0.1
  bidirectional: true
  use_edge_features: true
  temporal_decoder: true
  heteroscedastic: true
  quantiles:
  - 0.05
  - 0.5
  - 0.95
  ensemble: 2
  no_graph_blocks: 2
  no_graph_width: 64
train:
  lr: 0.003
  weight_decay: 0.0001
  epochs: 4
  batch_graphs: 8
  grad_clip: 1.0
  scheduler: cosine
  warmup_epochs: 2
  w_impact: 1.0
  w_traj: 0.3
  w_timing: 0.2
  w_nll: 0.5
  w_quantile: 0.3
  patience: 0
eval:
  bootstrap: 200
  recall_k:
  - 3
  - 5
  coverage_levels:
  - 0.5
  - 0.8
  - 0.9
  - 0.95
  n_criticality_networks: 1
  criticality_duration: 8
  criticality_start: 4
  bench_warmup: 8
  bench_repeats: 8
