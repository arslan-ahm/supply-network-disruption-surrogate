[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sndsur"
version = "1.0.0"
description = "A learned surrogate for a multi-echelon supply-network simulator: counterfactual disruption impact instead of per-supplier risk scores"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Arslan Ahmad" }]
keywords = [
    "supply-chain",
    "graph-neural-network",
    "learned-surrogate",
    "counterfactual",
    "discrete-event-simulation",
    "uncertainty-quantification",
    "resilience",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
notebooks = ["jupyter>=1.0", "nbformat>=5.9", "nbconvert>=7.9"]

[project.scripts]
sndsur = "sndsur.cli:main"

[project.urls]
Homepage = "https://github.com/arslan-ahmad/supply-network-disruption-surrogate"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: marks tests that take more than a few seconds"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E741"]

[tool.ruff.lint.per-file-ignores]
# make_notebooks.py holds notebook *cell source* inside Python string literals.
# Wrapping those strings to 100 columns would wrap the code a reader sees in the
# rendered notebook, which is the wrong trade: the notebook is the artefact.
"scripts/make_notebooks.py" = ["E501"]
